<svg xmlns="http://www.w3.org/2000/svg" width="195" height="180" viewBox="0 0 195 180" role="img" aria-label="Movement">
  <defs>
    <linearGradient id="movement-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B9F5C8" />
      <stop offset="100%" stop-color="#6FCF97" />
    </linearGradient>
  </defs>
  <rect width="195" height="180" rx="20" fill="url(#movement-bg)" />
  <!-- Runner -->
