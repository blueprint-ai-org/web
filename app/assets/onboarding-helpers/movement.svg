  <path d="M100 78 L122 64" stroke="#2C1B3F" stroke-width="7" stroke-linecap="round" />
  <!-- Legs -->
  <path d="M100 78 L88 110 L78 130" stroke="#2C1B3F" stroke-width="7" stroke-linecap="round" fill="none" />
  <path d="M100 78 L116 108 L130 122" stroke="#2C1B3F" stroke-width="7" stroke-linecap="round" fill="none" />
  <!-- Speed lines -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="40" y1="80" x2="58" y2="80" />
    <line x1="34" y1="100" x2="56" y2="100" />
    <line x1="42" y1="120" x2="60" y2="120" />
