	createApiKey(name: String): ApiKeyPayload! @auth(type: USER, role: [ADMIN])
	"""
	Validate an API key and return associated tenant/user information.
	"""
	validateApiKey(api_key: String!): ValidateAPIKeyPayload! @auth(type: USER_OR_API)
