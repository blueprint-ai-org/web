	"""
	The darker companion of `color`, for the gradient behind the tile.
	"""
	secondaryColor: String
	"""
	Short words a student can tap to say why.
	"""
	chips: [String!]!
	"""
	This mood's place in its category's triad: 1, 2 or 3. Null for the ninety-two
	moods of the wheel, which have no triad.
	
	**The server derives the stored intensity from it** (1→2, 2→5, 3→8 on the same
	0..10 scale), so a client sends the mood it picked and never a number.
	"""
