	updateRule(input: UpdateRuleInput!): Rule! @auth(type: USER_OR_API)
	deleteRule(id: ID!): DeleteRuleResponse! @auth(type: USER_OR_API)
	testModels(input: TestModelsInput!): TestModelsResponse! @auth(type: USER_OR_API)
	createAnalysis(input: CreateAnalysisInput!): Analysis! @auth(type: USER_OR_API)
	updateAnalysis(input: UpdateAnalysisInput!): Analysis! @auth(type: USER)
	deleteAnalysis(id: ID!): DeleteAnalysisResponse! @auth(type: USER)
	createFeedback(input: CreateFeedbackInput!): Feedback! @auth(type: USER)
	updateFeedback(input: UpdateFeedbackInput!): Feedback! @auth(type: USER)
	deleteFeedback(id: ID!): DeleteFeedbackResponse! @auth(type: USER)
