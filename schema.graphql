"""
Optional filter for `listUsers` and `listUserSummaries`.

Everything but `user_type_id` arrived in step-12, and each one replaces a join
a client was doing over whole pages of the roster: a picker of "people not yet
in this school" was `listSchoolUsers(100)` minus `listUsers(100)`, so it was
wrong past a hundred of either.

**There is no name search.** The names are encrypted at rest and only the email
has a blind index, so `email` is an EXACT match and nothing else is offered.
Searching names needs a searchable index over encrypted data, which is a
separate design.
"""
input ListUsersFilterInput {
	user_type_id: String
	"""
	At most 500. More than that is a listing, not a filter.
	"""
	ids: [ID!]
	"""
	Live, non-pending members of this school.
	"""
	school: ID
	"""
