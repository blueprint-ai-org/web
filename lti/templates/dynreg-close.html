<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spark EQ — Registration complete</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           margin: 2rem; color: #222; }
    .ok { font-weight: 600; }
  </style>
</head>
<body>
  <p class="ok">Spark EQ registration complete. You can close this window.</p>
  <!--
    LTI Dynamic Registration §3.6 close-window protocol:
    https://www.imsglobal.org/spec/lti-dr/v1p0#step-4-completion-of-registration
    The tool signals registration completion by posting
    { subject: 'org.imsglobal.lti.close' } to its opener/parent so the
    Canvas registration dialog auto-closes.
  -->
  <script>
    (function () {
      try {
        var target = window.opener || window.parent;
        if (target && target !== window) {
          target.postMessage({ subject: 'org.imsglobal.lti.close' }, '*');
        }
      } catch (e) {
        // Best-effort; the visible message is the fallback.
      }
    })();
  </script>
</body>
</html>
